<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1117"/>
      <stop offset="100%" stop-color="#08090c"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#171923" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#10121a" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  
  <rect x="0" y="0" width="800" height="48" fill="#13151f" stroke="#1f2330" stroke-width="1"/>
  <circle cx="28" cy="24" r="10" fill="#f97316" opacity="0.8"/>
  <text x="48" y="29" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">BOYCOLD CAFE POS & INVENTORY</text>
  <rect x="650" y="12" width="120" height="24" rx="12" fill="#431407"/>
  <text x="670" y="28" fill="#fdba74" font-family="monospace" font-size="11">SHIFT #02 · OPEN</text>

  <!-- Left: POS Menu Grid -->
  <g transform="translate(30, 70)">
    <rect width="460" height="400" rx="12" fill="url(#panel)" stroke="#222634"/>
    <text x="20" y="30" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Quick Order Terminal</text>

    <!-- Menu Items -->
    <g transform="translate(20, 50)">
      <rect width="130" height="90" rx="8" fill="#1a1c28" stroke="#2c3245"/>
      <text x="14" y="32" fill="#fed7aa" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Iced Spanish</text>
      <text x="14" y="50" fill="#fed7aa" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Latte</text>
      <text x="14" y="75" fill="#10b981" font-family="monospace" font-size="12" font-weight="700">₱ 140.00</text>
    </g>

    <g transform="translate(165, 50)">
      <rect width="130" height="90" rx="8" fill="#1a1c28" stroke="#2c3245"/>
      <text x="14" y="32" fill="#fed7aa" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Sea Salt</text>
      <text x="14" y="50" fill="#fed7aa" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Cold Brew</text>
      <text x="14" y="75" fill="#10b981" font-family="monospace" font-size="12" font-weight="700">₱ 165.00</text>
    </g>

    <g transform="translate(310, 50)">
      <rect width="130" height="90" rx="8" fill="#1a1c28" stroke="#2c3245"/>
      <text x="14" y="32" fill="#fed7aa" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Matcha Green</text>
      <text x="14" y="50" fill="#fed7aa" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Tea Cloud</text>
      <text x="14" y="75" fill="#10b981" font-family="monospace" font-size="12" font-weight="700">₱ 155.00</text>
    </g>

    <g transform="translate(20, 155)">
      <rect width="130" height="90" rx="8" fill="#1a1c28" stroke="#2c3245"/>
      <text x="14" y="32" fill="#fed7aa" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Caramel</text>
      <text x="14" y="50" fill="#fed7aa" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Macchiato</text>
      <text x="14" y="75" fill="#10b981" font-family="monospace" font-size="12" font-weight="700">₱ 150.00</text>
    </g>

    <g transform="translate(165, 155)">
      <rect width="130" height="90" rx="8" fill="#1a1c28" stroke="#2c3245"/>
      <text x="14" y="32" fill="#fed7aa" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Croissant</text>
      <text x="14" y="50" fill="#fed7aa" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Butter Toast</text>
      <text x="14" y="75" fill="#10b981" font-family="monospace" font-size="12" font-weight="700">₱ 110.00</text>
    </g>

    <g transform="translate(310, 155)">
      <rect width="130" height="90" rx="8" fill="#1a1c28" stroke="#2c3245"/>
      <text x="14" y="32" fill="#fed7aa" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Dark Choco</text>
      <text x="14" y="50" fill="#fed7aa" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Muffin</text>
      <text x="14" y="75" fill="#10b981" font-family="monospace" font-size="12" font-weight="700">₱ 95.00</text>
    </g>

    <rect x="20" y="270" width="420" height="105" rx="8" fill="#12141c" stroke="#222634"/>
    <text x="35" y="295" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">INVENTORY CRITICAL STOCK</text>
    <text x="35" y="320" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="12">Arabica Espresso Beans: 2.8 KG remaining (Re-order trigger: 3.0 KG)</text>
    <text x="35" y="342" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="12">Oat Milk Barista Blend: 6 Liters remaining</text>
    <rect x="35" y="352" width="180" height="6" rx="3" fill="#ea580c"/>
  </g>

  <!-- Right: Bill / Cashier Receipt -->
  <g transform="translate(515, 70)">
    <rect width="255" height="400" rx="12" fill="url(#panel)" stroke="#222634"/>
    <text x="20" y="30" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Current Receipt #104</text>
    <text x="20" y="48" fill="#64748b" font-family="monospace" font-size="10">Cashier: Harry Sevilla</text>

    <line x1="20" y1="65" x2="235" y2="65" stroke="#222634"/>
    <text x="20" y="90" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="12">1x Iced Spanish Latte</text>
    <text x="185" y="90" fill="#f1f5f9" font-family="monospace" font-size="12">₱ 140</text>
    <text x="20" y="115" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="12">1x Sea Salt Cold Brew</text>
    <text x="185" y="115" fill="#f1f5f9" font-family="monospace" font-size="12">₱ 165</text>
    <text x="20" y="140" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="12">2x Butter Croissant</text>
    <text x="185" y="140" fill="#f1f5f9" font-family="monospace" font-size="12">₱ 220</text>

    <line x1="20" y1="165" x2="235" y2="165" stroke="#222634"/>
    <text x="20" y="195" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Subtotal:</text>
    <text x="185" y="195" fill="#cbd5e1" font-family="monospace" font-size="12">₱ 525.00</text>
    <text x="20" y="218" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">VAT (12%):</text>
    <text x="185" y="218" fill="#cbd5e1" font-family="monospace" font-size="12">₱ 56.25</text>

    <text x="20" y="260" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="15" font-weight="800">TOTAL:</text>
    <text x="160" y="260" fill="#10b981" font-family="monospace" font-size="18" font-weight="800">₱ 525.00</text>

    <rect x="20" y="325" width="215" height="42" rx="8" fill="#ea580c"/>
    <text x="65" y="351" fill="#fff" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">PRINT THERMAL</text>
  </g>

</svg>