<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1117"/>
      <stop offset="100%" stop-color="#08090c"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#171923" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#10121a" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  
  <!-- Top App Navigation -->
  <rect x="0" y="0" width="800" height="48" fill="#13151f" stroke="#1f2330" stroke-width="1"/>
  <circle cx="28" cy="24" r="10" fill="#3b82f6" opacity="0.8"/>
  <text x="48" y="29" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">RNF FLEET DISPATCH</text>
  <rect x="230" y="14" width="70" height="20" rx="10" fill="#1e293b"/>
  <text x="245" y="28" fill="#10b981" font-family="monospace" font-size="10">● LIVE (28)</text>
  <text x="640" y="29" fill="#94a3b8" font-family="monospace" font-size="11">DISPATCH #8841-B</text>

  <!-- Metric KPI Cards -->
  <g transform="translate(30, 70)">
    <rect width="165" height="74" rx="10" fill="url(#panel)" stroke="#222634"/>
    <text x="16" y="26" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">ACTIVE TRUCKS</text>
    <text x="16" y="56" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="26" font-weight="800">24 / 28</text>
    <text x="110" y="54" fill="#10b981" font-family="monospace" font-size="11">86%</text>
  </g>
  <g transform="translate(220, 70)">
    <rect width="165" height="74" rx="10" fill="url(#panel)" stroke="#222634"/>
    <text x="16" y="26" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">IN-TRANSIT CARGO</text>
    <text x="16" y="56" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="26" font-weight="800">142.8 T</text>
    <text x="115" y="54" fill="#3b82f6" font-family="monospace" font-size="11">8 routes</text>
  </g>
  <g transform="translate(410, 70)">
    <rect width="165" height="74" rx="10" fill="url(#panel)" stroke="#222634"/>
    <text x="16" y="26" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">FLEET FUEL AVG</text>
    <text x="16" y="56" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="26" font-weight="800">8.4 km/L</text>
    <text x="125" y="54" fill="#10b981" font-family="monospace" font-size="11">+4%</text>
  </g>
  <g transform="translate(600, 70)">
    <rect width="170" height="74" rx="10" fill="url(#panel)" stroke="#222634"/>
    <text x="16" y="26" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">MAINTENANCE ALERTS</text>
    <text x="16" y="56" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="26" font-weight="800">2 Due</text>
    <text x="110" y="54" fill="#f59e0b" font-family="monospace" font-size="11">Pending</text>
  </g>

  <!-- Telemetry Table -->
  <g transform="translate(30, 165)">
    <rect width="740" height="305" rx="12" fill="url(#panel)" stroke="#222634"/>
    <rect x="0" y="0" width="740" height="38" rx="12" fill="#13151f"/>
    <text x="24" y="24" fill="#64748b" font-family="monospace" font-size="11" font-weight="600">UNIT / TRUCK ID</text>
    <text x="170" y="24" fill="#64748b" font-family="monospace" font-size="11" font-weight="600">DRIVER ASSIGNED</text>
    <text x="330" y="24" fill="#64748b" font-family="monospace" font-size="11" font-weight="600">ROUTE MANIFEST</text>
    <text x="510" y="24" fill="#64748b" font-family="monospace" font-size="11" font-weight="600">CARGO WEIGHT</text>
    <text x="640" y="24" fill="#64748b" font-family="monospace" font-size="11" font-weight="600">STATUS</text>

    <!-- Row 1 -->
    <line x1="16" y1="85" x2="724" y2="85" stroke="#1c202d"/>
    <text x="24" y="65" fill="#f1f5f9" font-family="monospace" font-size="13" font-weight="700">TRK-409A (10-WHEEL)</text>
    <text x="170" y="65" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="13">R. Dela Cruz</text>
    <text x="330" y="65" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Manila Port → Batangas Hub</text>
    <text x="510" y="65" fill="#cbd5e1" font-family="monospace" font-size="12">24,500 KG</text>
    <rect x="635" y="50" width="75" height="22" rx="6" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.4)"/>
    <text x="648" y="65" fill="#10b981" font-family="monospace" font-size="10" font-weight="600">TRANSIT</text>

    <!-- Row 2 -->
    <line x1="16" y1="138" x2="724" y2="138" stroke="#1c202d"/>
    <text x="24" y="118" fill="#f1f5f9" font-family="monospace" font-size="13" font-weight="700">TRK-212B (6-WHEEL)</text>
    <text x="170" y="118" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="13">M. Santos</text>
    <text x="330" y="118" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Bulacan Plant → Pampanga</text>
    <text x="510" y="118" fill="#cbd5e1" font-family="monospace" font-size="12">14,200 KG</text>
    <rect x="635" y="103" width="75" height="22" rx="6" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.4)"/>
    <text x="648" y="118" fill="#10b981" font-family="monospace" font-size="10" font-weight="600">TRANSIT</text>

    <!-- Row 3 -->
    <line x1="16" y1="191" x2="724" y2="191" stroke="#1c202d"/>
    <text x="24" y="171" fill="#f1f5f9" font-family="monospace" font-size="13" font-weight="700">TRK-105C (ISUZU GIGA)</text>
    <text x="170" y="171" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="13">E. Bautista</text>
    <text x="330" y="171" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Subic Freeport → Valenzuela</text>
    <text x="510" y="171" fill="#cbd5e1" font-family="monospace" font-size="12">31,000 KG</text>
    <rect x="635" y="156" width="75" height="22" rx="6" fill="rgba(59,130,246,0.15)" stroke="rgba(59,130,246,0.4)"/>
    <text x="648" y="171" fill="#60a5fa" font-family="monospace" font-size="10" font-weight="600">AT DEPOT</text>

    <!-- Row 4 -->
    <line x1="16" y1="244" x2="724" y2="244" stroke="#1c202d"/>
    <text x="24" y="224" fill="#f1f5f9" font-family="monospace" font-size="13" font-weight="700">TRK-304D (TRACTOR)</text>
    <text x="170" y="224" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="13">K. Alvarez</text>
    <text x="330" y="224" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Scheduled Service Bay 2</text>
    <text x="510" y="224" fill="#cbd5e1" font-family="monospace" font-size="12">—</text>
    <rect x="635" y="209" width="75" height="22" rx="6" fill="rgba(245,158,11,0.15)" stroke="rgba(245,158,11,0.4)"/>
    <text x="644" y="224" fill="#fbbf24" font-family="monospace" font-size="10" font-weight="600">INSPECT</text>
  </g>

</svg>