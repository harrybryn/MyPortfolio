<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1117"/>
      <stop offset="100%" stop-color="#08090c"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#171923" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#10121a" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  
  <rect x="0" y="0" width="800" height="48" fill="#13151f" stroke="#1f2330" stroke-width="1"/>
  <circle cx="28" cy="24" r="10" fill="#8b5cf6" opacity="0.8"/>
  <text x="48" y="29" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">TOGETHER · GROUP EVENT HUB</text>
  <rect x="635" y="12" width="135" height="24" rx="12" fill="#2e1065"/>
  <text x="655" y="28" fill="#c4b5fd" font-family="-apple-system, sans-serif" font-size="11">+ Create Meetup</text>

  <!-- Left Chat & Poll Area -->
  <g transform="translate(30, 70)">
    <rect width="360" height="400" rx="14" fill="url(#panel)" stroke="#222634"/>
    <text x="20" y="32" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">Live Group Coordination</text>
    <text x="20" y="52" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Weekend Tech Hackathon Meetup</text>

    <!-- Poll Box -->
    <rect x="20" y="75" width="320" height="110" rx="10" fill="#141724" stroke="#252a3a"/>
    <text x="35" y="100" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Poll: Meeting Location Saturday?</text>
    <rect x="35" y="112" width="220" height="20" rx="4" fill="rgba(139,92,246,0.3)"/>
    <text x="45" y="126" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="11">BGC High Street Cafe (72%)</text>
    <rect x="35" y="138" width="140" height="20" rx="4" fill="rgba(255,255,255,0.06)"/>
    <text x="45" y="152" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Makati Coworking Space (28%)</text>

    <!-- Message bubbles -->
    <rect x="20" y="205" width="230" height="42" rx="10" fill="#1e1b4b"/>
    <text x="32" y="223" fill="#c4b5fd" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Sarah M.</text>
    <text x="32" y="238" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="11">I reserved table 4 with power outlets!</text>

    <rect x="110" y="260" width="230" height="42" rx="10" fill="#4338ca"/>
    <text x="122" y="278" fill="#e0e7ff" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Harry Sevilla</text>
    <text x="122" y="293" fill="#fff" font-family="-apple-system, sans-serif" font-size="11">Awesome, I have the projector ready.</text>
  </g>

  <!-- Right Split Expense Calculator -->
  <g transform="translate(415, 70)">
    <rect width="355" height="400" rx="14" fill="url(#panel)" stroke="#222634"/>
    <text x="20" y="32" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">Group Expense Splitter</text>
    <text x="20" y="52" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Total Shared: ₱ 8,450.00 (4 Members)</text>

    <g transform="translate(20, 80)">
      <rect width="315" height="58" rx="8" fill="#141724"/>
      <text x="16" y="26" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Food & Beverage Platter</text>
      <text x="16" y="45" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Paid by Sarah · 4 shares</text>
      <text x="240" y="35" fill="#10b981" font-family="monospace" font-size="14" font-weight="700">₱ 4,200</text>
    </g>

    <g transform="translate(20, 150)">
      <rect width="315" height="58" rx="8" fill="#141724"/>
      <text x="16" y="26" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Conference Room Booking</text>
      <text x="16" y="45" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Paid by Harry · 4 shares</text>
      <text x="240" y="35" fill="#10b981" font-family="monospace" font-size="14" font-weight="700">₱ 4,250</text>
    </g>

    <g transform="translate(20, 230)">
      <rect width="315" height="130" rx="10" fill="#1e1e2d" stroke="#312e81"/>
      <text x="20" y="28" fill="#a5b4fc" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">SETTLEMENT SUMMARY</text>
      <text x="20" y="55" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="12">Alex owes Harry: ₱ 2,112.50</text>
      <text x="20" y="80" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="12">John owes Sarah: ₱ 2,112.50</text>
      <rect x="20" y="94" width="275" height="24" rx="6" fill="#4f46e5"/>
      <text x="100" y="110" fill="#fff" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Settle via GCash</text>
    </g>
  </g>

</svg>