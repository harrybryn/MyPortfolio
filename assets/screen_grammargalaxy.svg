  <rect x="0" y="0" width="800" height="48" fill="#13151f" stroke="#1f2330" stroke-width="1"/>
  <circle cx="28" cy="24" r="10" fill="#ec4899" opacity="0.8"/>
  <text x="48" y="29" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">GRAMMAR GALAXY · CODING QUEST</text>
  <text x="660" y="29" fill="#f472b6" font-family="monospace" font-size="12">LEVEL 14 · 2,450 XP</text>

  <!-- Interactive Code Terminal -->
  <g transform="translate(30, 70)">
    <rect width="740" height="400" rx="12" fill="#0c0d14" stroke="#252a3a"/>
    <rect width="740" height="34" rx="12" fill="#161824"/>
