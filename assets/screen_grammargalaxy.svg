    <circle cx="46" cy="17" r="4" fill="#10b981"/>
    <text x="70" y="21" fill="#94a3b8" font-family="monospace" font-size="11">quest_04_async_promise.js</text>

    <!-- Code Editor Content -->
    <text x="25" y="70" fill="#64748b" font-family="monospace" font-size="13">01</text>
    <text x="55" y="70" fill="#f43f5e" font-family="monospace" font-size="13">async function</text>
    <text x="180" y="70" fill="#38bdf8" font-family="monospace" font-size="13">fetchPlayerCosmicData</text>
    <text x="350" y="70" fill="#f8fafc" font-family="monospace" font-size="13">(playerId) {</text>

    <text x="25" y="95" fill="#64748b" font-family="monospace" font-size="13">02</text>
    <text x="80" y="95" fill="#a855f7" font-family="monospace" font-size="13">const</text>
    <text x="135" y="95" fill="#f8fafc" font-family="monospace" font-size="13">response = </text>
    <text x="235" y="95" fill="#f43f5e" font-family="monospace" font-size="13">await</text>
    <text x="290" y="95" fill="#38bdf8" font-family="monospace" font-size="13">cosmicApi</text>
    <text x="360" y="95" fill="#f8fafc" font-family="monospace" font-size="13">.query('/pilot/' + playerId);</text>

    <text x="25" y="120" fill="#64748b" font-family="monospace" font-size="13">03</text>
    <text x="80" y="120" fill="#a855f7" font-family="monospace" font-size="13">if</text>
    <text x="105" y="120" fill="#f8fafc" font-family="monospace" font-size="13">(!response.verified) </text>
    <text x="295" y="120" fill="#f43f5e" font-family="monospace" font-size="13">throw new</text>
    <text x="385" y="120" fill="#fbbf24" font-family="monospace" font-size="13">CosmicError</text>
    <text x="480" y="120" fill="#f8fafc" font-family="monospace" font-size="13">('Shield Offline');</text>

    <text x="25" y="145" fill="#64748b" font-family="monospace" font-size="13">04</text>
    <text x="80" y="145" fill="#a855f7" font-family="monospace" font-size="13">return</text>
    <text x="140" y="145" fill="#38bdf8" font-family="monospace" font-size="13">calculateJumpTrajectory</text>
    <text x="330" y="145" fill="#f8fafc" font-family="monospace" font-size="13">(response.coordinates);</text>

    <text x="25" y="170" fill="#64748b" font-family="monospace" font-size="13">05</text>
    <text x="55" y="170" fill="#f8fafc" font-family="monospace" font-size="13">}</text>

    <!-- Test Runner Output -->
    <rect x="25" y="210" width="690" height="150" rx="8" fill="#131722" stroke="#23293a"/>
    <text x="45" y="238" fill="#10b981" font-family="monospace" font-size="13" font-weight="700">✔ TEST SUITE PASSED (4 / 4 Assertions)</text>
    <text x="45" y="265" fill="#94a3b8" font-family="monospace" font-size="11">▸ Mock API latency handled in 12ms</text>
    <text x="45" y="285" fill="#94a3b8" font-family="monospace" font-size="11">▸ Trajectory coordinates verified: Sector 7G [Alpha]</text>
    <text x="45" y="315" fill="#f472b6" font-family="monospace" font-size="12" font-weight="600">+150 XP AWARDED · UNLOCKED: "ASYNC ASTRONAUT" BADGE</text>
